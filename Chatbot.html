<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRrewear | Chatbot de Soporte</title>
    <style>
        /* Mismo diseño visual de tu interfaz original */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5; /* Gris claro estilo Facebook */
            color: #050505;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            background-color: #ffffff;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2b7a78;
            letter-spacing: 1px;
        }

        .logo span {
            color: #17252a;
        }

        /* --- CONTENEDOR DEL CHAT --- */
        .chat-container {
            max-width: 600px;
            width: 90%;
            background-color: #ffffff;
            margin: 30px auto 0 auto;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 550px;
            overflow: hidden;
        }

        /* Cabecera del chat */
        .chat-header {
            background-color: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid #ced0d4;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .bot-avatar {
            width: 40px;
            height: 40px;
            background-color: #2b7a78;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .bot-status-info h2 {
            font-size: 16px;
            font-weight: 700;
            color: #050505;
        }

        .bot-status-info p {
            font-size: 13px;
            color: #65676b;
        }

        /* Área de Mensajes */
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Burbujas de mensajes */
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* Mensaje del bot (Gris como Messenger) */
        .message.bot {
            background-color: #e4e6eb;
            color: #050505;
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        /* Mensaje del usuario (Azul como Messenger) */
        .message.user {
            background-color: #1877f2;
            color: white;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        /* Input y envío de texto */
        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid #ced0d4;
            background-color: #ffffff;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input {
            flex-grow: 1;
            background-color: #f0f2f5;
            border: 1px solid transparent;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            color: #050505;
            position: relative;
            z-index: 10;
        }

        .chat-input:focus {
            background-color: #ffffff;
            border-color: #1877f2;
        }

        .chat-input::placeholder {
            color: #65676b;
        }

        .btn-send {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            z-index: 10;
        }

        .btn-send:hover {
            background-color: #166fe5;
        }

        @media (max-width: 600px) {
            .chat-container {
                width: 100%;
                margin: 0;
                height: calc(100vh - 70px);
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">QR<span>rewear</span></div>
    </header>

    <!-- Caja de Chat principal -->
    <div class="chat-container">
        
        <div class="chat-header">
            <div class="bot-avatar">R</div>
            <div class="bot-status-info">
                <h2>Asistente QRrewear</h2>
                <p>En línea • Soporte Automático</p>
            </div>
        </div>

        <!-- Cuerpo con los mensajes -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                ¡Hola! Bienvenido a QRrewear. 🌿 ¿En qué te puedo ayudar hoy? Puedes preguntarme sobre nuestras prendas, los códigos QR o los envíos.
            </div>
        </div>

        <!-- Input inferior -->
        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="Escribe un mensaje aquí..." onkeypress="evaluarEnter(event)">
            <button class="btn-send" onclick="enviarMensaje()">Enviar</button>
        </div>

    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        // Función principal para enviar un mensaje
        function enviarMensaje() {
            const texto = userInput.value.trim();
            if (texto === '') return;

            // Renderizar mensaje del usuario en pantalla
            agregarBurbuja(texto, 'user');
            userInput.value = '';

            // Simular retraso de escritura y procesar respuesta del bot
            setTimeout(() => {
                const respuestaBot = procesarPregunta(texto);
                agregarBurbuja(respuestaBot, 'bot');
            }, 600);
        }

        // Detectar si el usuario presiona Enter en el teclado
        function evaluarEnter(event) {
            if (event.key === 'Enter') {
                enviarMensaje();
            }
        }

        // Añadir los divs al chat y hacer scroll automático al fondo
        function agregarBurbuja(texto, remitente) {
            const div = document.createElement('div');
            div.classList.add('message', remitente);
            div.innerText = texto;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Lógica de respuestas automáticas
        function procesarPregunta(mensaje) {
            const msgNormalizado = mensaje.trim().toLowerCase();

            // --- EASTER EGGS ---
            if (msgNormalizado === 'juancho y luhana') {
                return "MIS PAPIS";
            }
            if (msgNormalizado === 'j+l') {
                return "ellos se aman 67 millones de veces";
            }

            // --- RESPUESTAS DE SOPORTE ---
            if (msgNormalizado.includes('hola') || msgNormalizado.includes('buenas')) {
                return "¡Hola de nuevo! Dime, ¿en qué te puedo asesorar respecto al catálogo?";
            }
            if (msgNormalizado.includes('qr') || msgNormalizado.includes('codigo')) {
                return "Cada prenda tiene un código QR único. Al escanearlo, podrás ver cuántas lavadas tiene, su talla exacta y el historial de uso real.";
            }
            if (msgNormalizado.includes('blusa') || msgNormalizado.includes('negra') || msgNormalizado.includes('camiseta') || msgNormalizado.includes('azul')) {
                return "Actualmente disponemos de la Blusa Negra Manga Larga (Talla S) y la Camiseta Azul Cuello Alto (Talla M). Ambas cuestan S/. 25.00.";
            }
            if (msgNormalizado.includes('precio') || msgNormalizado.includes('cuanto cuesta') || msgNormalizado.includes('costo')) {
                return "Nuestras prendas tienen un precio base de S/. 25.00, pero si registran más de 5 usos, ¡el sistema baja el precio de forma automática!";
            }

            return "Interesante pregunta. De momento no tengo esa información exacta, pero puedes consultar directamente enviando un mensaje al vendedor desde el botón del producto.";
        }
    </script>
</body>
</html>
